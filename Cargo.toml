# AETHER Rust workspace.
#
# Members are added as each layer lands. Layer 4 is built in dependency order:
#   1. mcp-bridge/crates/jsonrpc
#   2. mcp-bridge/crates/toolbus        <- core library now; socket shell next
#   3. mcp-bridge/crates/sandbox-runner
#   4. gateway
# (tokenizer, research-crawler/* and src-tauri join with Layers 1, 3 and 5.)
[workspace]
resolver = "2"
members = ["mcp-bridge/crates/jsonrpc", "mcp-bridge/crates/toolbus"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Every external crate is declared once, here. All of them are vendored
# (scripts/vendor.sh), so builds are offline and reproducible.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
sha2 = "0.10"
aether-jsonrpc = { path = "mcp-bridge/crates/jsonrpc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
